name: Deploy IMPERIUM background push

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
      PROJECT_REF: kpqhmmietusedznadjjy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install database and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client zip
      - name: Validate configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_URL"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64"
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["project_id"] and d["client_email"] and d["private_key"]'
      - name: Migrate push token schema
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f backend/push.sql
      - name: Configure Firebase and deploy Edge Function
        run: |
          umask 077
          printf 'FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" > /tmp/imperium-push.env
          supabase secrets set --env-file /tmp/imperium-push.env --project-ref "$PROJECT_REF"
          rm /tmp/imperium-push.env
          supabase functions deploy send-push --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Publish web registration update
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          version="$(psql "$SUPABASE_DB_URL" -Atqc 'select greatest(coalesce(max(version),0)+1,2) from public.app_updates')"
          cmp app.js android-wrapper/app/src/main/assets/app.js
          mkdir -p package/icons package/sounds
          cp android-wrapper/app/src/main/assets/{index.html,app.js,styles.css,config.js,manifest.webmanifest,sw.js} package/
          cp android-wrapper/app/src/main/assets/icons/icon.svg package/icons/
          cp android-wrapper/app/src/main/assets/sounds/imperium_notification.mp3 package/sounds/
          (cd package && zip -qr "../imperium-web-${version}.zip" .)
          curl --fail-with-body -X POST \
            "https://$PROJECT_REF.supabase.co/storage/v1/object/app-updates/imperium-web-${version}.zip" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H 'Content-Type: application/zip' -H 'x-upsert: true' \
            --data-binary "@imperium-web-${version}.zip"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v version="$version" \
            -v package_url="https://$PROJECT_REF.supabase.co/storage/v1/object/app-updates/imperium-web-${version}.zip" <<'SQL'
          begin;
          update public.app_updates set active=false where active=true;
          insert into public.app_updates(version,version_name,package_url,active)
          values (:'version'::integer, 'Powiadomienia w tle', :'package_url', true);
          commit;
          SQL
