name: Build IMPERIUM desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'invoice-format.js'
      - 'invoice-pdf.js'
      - 'pdf-lib.min.js'
      - 'fontkit.umd.min.js'
      - 'invoice-font-data.js'
      - 'pdf.min.mjs'
      - 'pdf.worker.min.mjs'
      - 'invoice-font-LICENSE.txt'
      - 'pdf-lib-LICENSE.md'
      - 'fontkit-LICENSE.txt'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python desktop/prepare.py
      - name: Install dependencies and build installer
        working-directory: desktop
        run: |
          npm install
          npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-Windows
          path: desktop/out/make/squirrel.windows/x64/*
          if-no-files-found: error

      - name: Publish downloadable Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "desktop-${{ github.run_number }}" \
            desktop/out/make/squirrel.windows/x64/IMPERIUM-Setup.exe \
            --title "IMPERIUM Windows ${{ github.run_number }}" \
            --notes "Desktopowa wersja IMPERIUM. Logowanie tym samym kontem co w aplikacji mobilnej." \
            --latest
