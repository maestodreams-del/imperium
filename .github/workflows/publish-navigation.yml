name: Publish IMPERIUM Navigation 6.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-navigation.yml']
  pull_request:
    paths: ['.github/workflows/publish-navigation.yml', 'navigation*', 'backend/navigation.sql', 'tests/navigation*', 'android-wrapper/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperium-navigation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: communications
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bundle and DOM behavior
        run: |
          set -euo pipefail
          for file in app.js navigation.js navigation-core.js communications.js startup.js sw.js; do node --check "$file"; done
          for file in app.js navigation.js navigation-core.js navigation.css leaflet.js leaflet.css leaflet-LICENSE.txt communications.js communications.css social.js social.css startup.js biotech.css styles.css config.js index.html manifest.webmanifest sw.js icons/icon.svg; do cmp "$file" "android-wrapper/app/src/main/assets/$file"; done
          npm install --prefix "$RUNNER_TEMP/comms-test" jsdom@26.1.0 playwright@1.58.2 @electric-sql/pglite@0.3.14 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/comms-test/node_modules" node tests/biotech-dom.cjs
          node tests/navigation-core.cjs
          NODE_PATH="$RUNNER_TEMP/comms-test/node_modules" node tests/navigation-http.cjs
      - name: Verify navigation on PostgreSQL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: fixture-only
          PGDATABASE: communications
        run: |
          sed '/^create extension if not exists http with schema extensions;/d' backend/navigation.sql > /tmp/navigation-ci.sql
          psql -v ON_ERROR_STOP=1 --single-transaction -f tests/communications-db-fixture.sql -f tests/social-db-fixture.sql -f backend/profile-messages.sql -f backend/biotech-owner-access.sql -f backend/communications.sql -f backend/social.sql -f tests/navigation-http-fixture.sql -f /tmp/navigation-ci.sql -f /tmp/navigation-ci.sql -f tests/navigation-db.sql -f tests/social-db.sql
      - name: Verify mobile and desktop interaction
        env:
          QA_OUTPUT: ${{ runner.temp }}/navigation-screenshots
        run: |
          "$RUNNER_TEMP/comms-test/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/comms-test/node_modules" node tests/navigation-browser.cjs
          NODE_PATH="$RUNNER_TEMP/comms-test/node_modules" node tests/biotech-browser.cjs
          python3 -m http.server 8769 --bind 127.0.0.1 >"$RUNNER_TEMP/comms-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do curl -fsS http://127.0.0.1:8769/index.html >/dev/null && break || sleep 1; done
          NODE_PATH="$RUNNER_TEMP/comms-test/node_modules" node tests/salary-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IMPERIUM-Navigation-screenshots
          path: ${{ runner.temp }}/navigation-screenshots
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native browser and verify filtering policy
        working-directory: android-wrapper
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
  publish:
    if: github.event_name != 'pull_request'
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allocate web version and restore signing key
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KEYSTORE_BASE64: ${{ secrets.IMPERIUM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          version="$(psql "$SUPABASE_DB_URL" -Atqc 'select greatest(coalesce(max(version),0)+1,50) from public.app_updates')"
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"
          sed -i -E "s/BUNDLED_WEB_VERSION = [0-9]+/BUNDLED_WEB_VERSION = $version/" android-wrapper/app/src/main/java/pl/imperium/app/MainActivity.java
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-wrapper/imperium-release.jks
      - name: Build signed APK 6.1
        working-directory: android-wrapper
        env:
          IMPERIUM_KEYSTORE_PASSWORD: ${{ secrets.IMPERIUM_KEYSTORE_PASSWORD }}
          IMPERIUM_KEY_PASSWORD: ${{ secrets.IMPERIUM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Package APK and web update
        run: |
          set -euo pipefail
          cp android-wrapper/app/build/outputs/apk/release/app-release.apk IMPERIUM-6.1.0.apk
          mkdir -p package/icons package/sounds
          for file in index.html app.js startup.js biotech.css communications.js communications.css social.js social.css navigation.js navigation-core.js navigation.css leaflet.js leaflet.css leaflet-LICENSE.txt styles.css config.js manifest.webmanifest sw.js invoice-format.js invoice-pdf.js pdf-lib.min.js fontkit.umd.min.js invoice-font-data.js invoice-font-LICENSE.txt pdf-lib-LICENSE.md fontkit-LICENSE.txt pdf.min.mjs pdf.worker.min.mjs pdfjs-LICENSE.txt salary-aurelia.webp; do cp "android-wrapper/app/src/main/assets/$file" package/; done
          cp android-wrapper/app/src/main/assets/icons/icon.svg package/icons/
          cp android-wrapper/app/src/main/assets/sounds/imperium_notification.mp3 package/sounds/
          (cd package && zip -qr "../imperium-web-${WEB_VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-6.1.0-signed
          path: IMPERIUM-6.1.0.apk
          if-no-files-found: error
      - name: Upload installable APK and inactive web package
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://kpqhmmietusedznadjjy.supabase.co
        run: |
          set -euo pipefail
          for file in IMPERIUM-6.1.0.apk "imperium-web-${WEB_VERSION}.zip"; do
            curl --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/app-updates/$file" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/octet-stream' -H 'x-upsert: true' --data-binary "@$file"
          done
      - name: Verify uploaded package bytes
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail-with-body "https://kpqhmmietusedznadjjy.supabase.co/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" --output /tmp/downloaded-navigation.zip
          cmp "imperium-web-${WEB_VERSION}.zip" /tmp/downloaded-navigation.zip
      - name: Publish downloadable Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.txt <<'NOTES'
          IMPERIUM 6.1 — nawigacja: profile samochodu i ciężarówki, dystans i czas, planowane opłaty drogowe, porównanie wariantów, unikanie płatnych dróg, autostrad, promów i tuneli. GPS, instrukcje głosowe i przeliczanie trasy przy otwartym IMPERIUM.

          Zainstaluj na obecnej aplikacji jako aktualizację. Właściciel musi dodać własny klucz HERE w zakładce Nawigacja (Routing API v8, Toll Costs, Geocoding & Search). Bez połączenia HERE nie ma obliczania tras ani taryf. Opłaty są szacunkowe. Niepełne taryfy i naruszenia ograniczeń nie są prezentowane jako poprawna bezpłatna trasa. Prowadzenie zatrzymuje się po schowaniu aplikacji.
          NOTES
          if gh release view v6.1.0 >/dev/null 2>&1; then
            gh release upload v6.1.0 IMPERIUM-6.1.0.apk --clobber
          else
            gh release create v6.1.0 IMPERIUM-6.1.0.apk --target "$GITHUB_SHA" --title 'IMPERIUM 6.1 — Navigation' --notes-file /tmp/release-notes.txt
          fi
      - name: Activate navigation and update atomically
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          cat > /tmp/activate-navigation.sql <<'SQL'
          update public.app_updates set active=false where active=true;
          insert into public.app_updates(version,version_name,package_url,active)
          values (:'version'::integer,'IMPERIUM 6.1 · Nawigacja · Trasy i opłaty',:'package_url',true);
          SQL
          psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -v version="$WEB_VERSION" -v package_url="https://kpqhmmietusedznadjjy.supabase.co/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" -f backend/navigation.sql -f tests/navigation-db.sql -f /tmp/activate-navigation.sql
          psql "$SUPABASE_DB_URL" -Atqc 'select version,version_name,active from public.app_updates where active=true'
          psql "$SUPABASE_DB_URL" -Atqc 'select exists(select 1 from imperium_private.navigation_config) as here_configured'
