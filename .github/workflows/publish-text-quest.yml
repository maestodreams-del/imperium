name: Publish IMPERIUM text quest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-text-quest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install database and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client zip
      - name: Resolve exact notice audience
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node --check app.js
          node --check game.js
          node tests/quest-checks.cjs
          cmp app.js android-wrapper/app/src/main/assets/app.js
          cmp game.js android-wrapper/app/src/main/assets/game.js
          cmp index.html android-wrapper/app/src/main/assets/index.html
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from public.profiles where active and full_name ~* '^(Zenon|Zenek|Зенон)( |$)') <> 1 then raise exception 'Zenon account is ambiguous'; end if;
            if (select count(*) from public.salary_managers m join public.profiles p on p.id=m.profile_id where p.active) <> 1 then raise exception 'Owner account is ambiguous'; end if;
            if exists(select 1 from public.salary_managers m join public.profiles p on p.id=m.profile_id where p.active and p.full_name ~* '^(Zenon|Zenek|Зенон)( |$)') then raise exception 'Owner and Zenon must differ'; end if;
          end $$;
          SQL
          psql "$SUPABASE_DB_URL" -Atqc "select 'window.IMPERIUM_REDUCTION_ACCESS=' || json_build_object('zenonId',(select id from public.profiles where active and full_name ~* '^(Zenon|Zenek|Зенон)( |$)'), 'ownerId',(select m.profile_id from public.salary_managers m join public.profiles p on p.id=m.profile_id where p.active))::text || ';'" >> android-wrapper/app/src/main/assets/config.js
      - name: Migrate and allocate update number
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          version="$(psql "$SUPABASE_DB_URL" -Atqc 'select greatest(coalesce(max(version),0)+1,2) from public.app_updates')"
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Package web update
        run: |
          set -euo pipefail
          cmp app.js android-wrapper/app/src/main/assets/app.js
          cmp game.js android-wrapper/app/src/main/assets/game.js
          cmp index.html android-wrapper/app/src/main/assets/index.html
          cmp salary-aurelia.webp android-wrapper/app/src/main/assets/salary-aurelia.webp
          cmp styles.css android-wrapper/app/src/main/assets/styles.css
          cmp invoice-format.js android-wrapper/app/src/main/assets/invoice-format.js
          cmp invoice-pdf.js android-wrapper/app/src/main/assets/invoice-pdf.js
          cmp pdf.worker.min.mjs android-wrapper/app/src/main/assets/pdf.worker.min.mjs
          mkdir -p package/icons package/sounds
          cp android-wrapper/app/src/main/assets/{index.html,app.js,game.js,styles.css,config.js,manifest.webmanifest,sw.js,invoice-format.js,invoice-pdf.js,pdf-lib.min.js,fontkit.umd.min.js,invoice-font-data.js,invoice-font-LICENSE.txt,pdf-lib-LICENSE.md,fontkit-LICENSE.txt,pdf.min.mjs,pdf.worker.min.mjs,pdfjs-LICENSE.txt,salary-aurelia.webp} package/
          cp android-wrapper/app/src/main/assets/icons/icon.svg package/icons/
          cp android-wrapper/app/src/main/assets/sounds/imperium_notification.mp3 package/sounds/
          (cd package && zip -qr "../imperium-web-${WEB_VERSION}.zip" .)
      - name: Upload web update
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://kpqhmmietusedznadjjy.supabase.co
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          curl --fail-with-body -X POST \
            "$SUPABASE_URL/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H 'Content-Type: application/zip' -H 'x-upsert: true' \
            --data-binary "@imperium-web-${WEB_VERSION}.zip"
      - name: Activate automatic update
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v version="$WEB_VERSION" \
            -v package_url="https://kpqhmmietusedznadjjy.supabase.co/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" <<'SQL'
          begin;
          update public.app_updates set active=false where active=true;
          insert into public.app_updates(version,version_name,package_url,active)
          values (:'version'::integer, 'Aurelia: Pogranicze · gra tekstowa · odblokowane zakładki Zenona', :'package_url', true);
          commit;
          SQL
