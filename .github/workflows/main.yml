name: Build IMPERIUM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore IMPERIUM signing key
        shell: bash
        run: |
          echo "${{ secrets.IMPERIUM_KEYSTORE_BASE64 }}" | base64 --decode > android-wrapper/imperium-release.jks

      - name: Verify bundled web UI
        run: |
          grep -q "Meldunek" android-wrapper/app/src/main/assets/app.js
          cmp app.js android-wrapper/app/src/main/assets/app.js
          cmp styles.css android-wrapper/app/src/main/assets/styles.css

      - name: Build signed IMPERIUM release
        working-directory: android-wrapper
        env:
          IMPERIUM_KEYSTORE_PASSWORD: ${{ secrets.IMPERIUM_KEYSTORE_PASSWORD }}
          IMPERIUM_KEY_PASSWORD: ${{ secrets.IMPERIUM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android-wrapper/app/build/outputs/apk/release/app-release.apk IMPERIUM-5.2.2.apk

      - name: Upload IMPERIUM APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-5.2.2
          path: IMPERIUM-5.2.2.apk
          if-no-files-found: error
