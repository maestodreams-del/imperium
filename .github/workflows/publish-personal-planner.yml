name: Publish IMPERIUM 7 Personal Planner
on:
  push:
    branches: [main]
    paths: ['planner*', 'index.html', 'sw.js', 'manifest.webmanifest', 'icons/planner.svg', 'backend/personal-planner.sql', '.github/workflows/publish-personal-planner.yml', 'android-wrapper/app/src/main/java/pl/imperium/app/Planner*', 'android-wrapper/app/build.gradle.kts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperium-personal-planner-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify planner logic and Android asset parity
        run: |
          set -euo pipefail
          node --check planner.js
          node --check planner-core.js
          node --check sw.js
          node tests/planner-core.cjs
          for file in index.html legacy.html planner.js planner-core.js planner.css config.js manifest.webmanifest sw.js icons/planner.svg; do
            cmp "$file" "android-wrapper/app/src/main/assets/$file"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify existing database and reserve version
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tests/planner-db.sql
          test "$(psql "$SUPABASE_DB_URL" -Atqc 'select owner_only from public.imperium_access_control where singleton')" = t
          version="$(psql "$SUPABASE_DB_URL" -Atqc 'select greatest(coalesce(max(version),0)+1,52) from public.app_updates')"
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"
          sed -i -E "s/BUNDLED_WEB_VERSION = [0-9]+/BUNDLED_WEB_VERSION = $version/" android-wrapper/app/src/main/java/pl/imperium/app/MainActivity.java
      - name: Restore existing APK signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.IMPERIUM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-wrapper/imperium-release.jks
      - name: Compile and test native Android reminders
        working-directory: android-wrapper
        env:
          IMPERIUM_KEYSTORE_PASSWORD: ${{ secrets.IMPERIUM_KEYSTORE_PASSWORD }}
          IMPERIUM_KEY_PASSWORD: ${{ secrets.IMPERIUM_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Prepare packages
        run: |
          set -euo pipefail
          cp android-wrapper/app/build/outputs/apk/release/app-release.apk IMPERIUM-7.0.0.apk
          (cd android-wrapper/app/src/main/assets && zip -qr "$GITHUB_WORKSPACE/imperium-web-${WEB_VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-7.0.0-signed
          path: IMPERIUM-7.0.0.apk
          if-no-files-found: error
      - name: Upload and verify inactive package
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://kpqhmmietusedznadjjy.supabase.co
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          for file in IMPERIUM-7.0.0.apk "imperium-web-${WEB_VERSION}.zip"; do
            curl --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/app-updates/$file" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" -H 'Content-Type: application/octet-stream' -H 'x-upsert: true' --data-binary "@$file"
          done
          curl --fail-with-body "$SUPABASE_URL/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" -H "apikey: $SUPABASE_SECRET_KEY" --output /tmp/downloaded-planner.zip
          cmp "imperium-web-${WEB_VERSION}.zip" /tmp/downloaded-planner.zip
      - name: Publish signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/planner-release-notes.txt <<'NOTES'
          IMPERIUM 7.0 — личный планировщик.

          День, входящие, неделя, календарь, доска задач, проекты, подзадачи, приоритеты, повторы, заметки, фокус-таймер, статистика, поиск, светлая/тёмная темы, экспорт JSON и ICS. Прежние данные доступны в архиве.

          Установите APK поверх текущей версии и войдите с прежним аккаунтом владельца. Для фоновых напоминаний разрешите уведомления в настройках приложения. Для точного времени выдайте Android разрешение «Будильники и напоминания». Синхронизация расписания с другими устройствами выполняется при открытии приложения; режим энергосбережения и принудительная остановка могут влиять на доставку.
          NOTES
          if gh release view v7.0.0 >/dev/null 2>&1; then
            gh release upload v7.0.0 IMPERIUM-7.0.0.apk --clobber
          else
            gh release create v7.0.0 IMPERIUM-7.0.0.apk --target "$GITHUB_SHA" --title 'IMPERIUM 7.0 — Personal Planner' --notes-file /tmp/planner-release-notes.txt
          fi
      - name: Activate the verified web update
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          cat > /tmp/activate-planner.sql <<'SQL'
          select pg_advisory_xact_lock(hashtext('imperium-web-release'));
          update public.app_updates set active=false where active;
          insert into public.app_updates(version,version_name,package_url,active)
          values(:'version'::integer,'IMPERIUM 7 · Личный планировщик',:'package_url',true);
          SQL
          psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 -v version="$WEB_VERSION" -v package_url="https://kpqhmmietusedznadjjy.supabase.co/storage/v1/object/app-updates/imperium-web-${WEB_VERSION}.zip" -f /tmp/activate-planner.sql
          psql "$SUPABASE_DB_URL" -Atqc 'select version,version_name,active from public.app_updates where active'
